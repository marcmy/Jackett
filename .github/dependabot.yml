version: 2

updates:
  - package-ecosystem: "nuget"
    directory: "/src"
    schedule:
      interval: "daily"
      time: "12:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 100
    cooldown:
      default-days: 7
    groups:
      routine-nuget:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # FluentAssertions 8+ is under the commercial Xceed license; stay on 7.x
      # like upstream Jackett.
      - dependency-name: "FluentAssertions"
        versions: [">= 8.0.0"]
      - dependency-name: "Microsoft.AspNetCore.DataProtection"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.Security.Cryptography.ProtectedData"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.Security.Cryptography.Xml"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.ServiceProcess.ServiceController"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.Text.Encoding.CodePages"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.Text.Json"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "12:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 100
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
