name: Fork maintenance tests

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/scripts/**'
      - '.github/workflows/sync-upstream.yml'
      - '.github/workflows/maintenance-tests.yml'
  push:
    branches: [master]
    paths:
      - '.github/scripts/**'
      - '.github/workflows/sync-upstream.yml'
      - '.github/workflows/maintenance-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-conflicts:
    name: Package conflict resolver
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test version conflict resolution and fork preservation
        run: python3 -m unittest discover -s .github/scripts/tests -p 'test_*.py' -v
