name: Dispatch upstream sync once

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/dispatch-sync-once.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch Sync upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sync-upstream.yml --ref master
