name: Supply-chain audit

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  schedule:
    - cron: "23 7 * * 1"

permissions: {}

jobs:
  trivy:
    name: Trivy security scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan repository with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload findings to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: trivy-results.sarif

  nuget-audit:
    name: NuGet dependency audit
    runs-on: windows-2022
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET 9
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 9.0.x

      - name: Restore solution with NuGet audit enabled
        shell: pwsh
        run: |
          dotnet restore src/Jackett.sln -p:NuGetAudit=true -p:NuGetAuditMode=all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Report vulnerable direct and transitive packages
        shell: pwsh
        run: |
          dotnet list src/Jackett.sln package --vulnerable --include-transitive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  syft:
    name: Generate independent SBOM
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate SPDX SBOM with Syft
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          artifact-name: sbom.spdx.json
          dependency-snapshot: true
          upload-artifact: true
          upload-release-assets: false
