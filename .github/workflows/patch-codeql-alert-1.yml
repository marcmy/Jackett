name: One-time CodeQL alert 1 patch

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/patch-codeql-alert-1.yml

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Treat optgroup labels as text
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/Jackett.Common/Content/libs/bootstrap-multiselect.js")
          text = path.read_text(encoding="utf-8")
          old = '''      if (this.options.enableHTML) {
            $('label b', $li).html(" " + label);
          }
          else {
            $('label b', $li).text(" " + label);
          }
'''
          new = '''      // Optgroup labels come from DOM attributes and must remain text.
          $('label b', $li).text(" " + label);
'''

          count = text.count(old)
          if count != 1:
              raise SystemExit(f"Expected exactly one vulnerable optgroup-label block, found {count}")

          path.write_text(text.replace(old, new), encoding="utf-8")

      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-codeql-alert-1.yml
          git add src/Jackett.Common/Content/libs/bootstrap-multiselect.js
          git diff --cached --check
          git diff --cached
          git commit -m "Treat optgroup labels as text"
          git push origin HEAD:master
          echo "PATCH_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Trigger verification and build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run codeql-fork.yml --ref master
          gh workflow run build-artifacts.yml --ref master -f source_ref="$PATCH_SHA"
