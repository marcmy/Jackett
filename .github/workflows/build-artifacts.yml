name: Build custom artifacts

on:
  push:
    branches:
      - master
    paths:
      - "src/**"
      - "Installer.iss"
      - "jackett_launcher.bat"
      - ".github/workflows/build-artifacts.yml"
  pull_request:
    branches:
      - master
    paths:
      - "src/**"
      - "Installer.iss"
      - "jackett_launcher.bat"
      - ".github/workflows/build-artifacts.yml"
  workflow_dispatch:
    inputs:
      source_ref:
        description: Jackett branch, tag, or commit to build
        required: false
        default: master
        type: string

permissions: {}

concurrency:
  group: build-custom-${{ inputs.source_ref || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  BUILD_CONFIGURATION: Release
  TARGET_FRAMEWORK: net11.0
  RUNTIME_IDENTIFIER: win-x86

jobs:
  build-windows:
    name: Windows x86
    runs-on: windows-2025
    timeout-minutes: 45

    outputs:
      source_sha: ${{ steps.revision.outputs.sha }}
      source_short_sha: ${{ steps.revision.outputs.short_sha }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false

      - name: Record source revision
        id: revision
        shell: pwsh
        run: |
          $sha = git rev-parse HEAD
          $shortSha = git rev-parse --short=12 HEAD
          "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "short_sha=$shortSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Set up .NET 11
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 11.0.x

      - name: Run regression tests
        shell: pwsh
        run: |
          dotnet test src/Jackett.Test/Jackett.Test.csproj --framework net11.0 --configuration Release --filter "FullyQualifiedName~FlareSolverrIntegrationTests|FullyQualifiedName~CardigannIndexer"
          if ($LASTEXITCODE -ne 0) { throw 'Jackett regression tests failed' }

      - name: Build Windows package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $version = "0.24.$env:GITHUB_RUN_NUMBER"
          $buildRoot = Join-Path $env:RUNNER_TEMP 'jackett-build'
          $packageRoot = Join-Path $env:RUNNER_TEMP 'jackett-package'
          $packageDir = Join-Path $packageRoot 'Jackett'
          $serverDir = Join-Path $buildRoot 'Jackett.Server'
          $updaterDir = Join-Path $buildRoot 'Jackett.Updater'
          $trayDir = Join-Path $buildRoot 'Jackett.Tray'
          $serviceDir = Join-Path $buildRoot 'Jackett.Service'

          Remove-Item $buildRoot, $packageRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item $serverDir, $updaterDir, $trayDir, $serviceDir, $packageDir -ItemType Directory -Force | Out-Null

          dotnet build src/DateTimeRoutines/DateTimeRoutines.csproj `
            --configuration $env:BUILD_CONFIGURATION `
            --runtime $env:RUNTIME_IDENTIFIER `
            --framework netstandard2.0
          if ($LASTEXITCODE -ne 0) { throw 'DateTimeRoutines build failed' }

          function Publish-JackettProject {
            param(
              [Parameter(Mandatory)] [string] $Project,
              [Parameter(Mandatory)] [string] $Framework,
              [Parameter(Mandatory)] [string] $Output
            )

            dotnet publish $Project `
              --configuration $env:BUILD_CONFIGURATION `
              --runtime $env:RUNTIME_IDENTIFIER `
              --framework $Framework `
              --self-contained true `
              --output $Output `
              /p:AssemblyVersion=$version `
              /p:FileVersion=$version `
              /p:InformationalVersion=$version `
              /p:Version=$version

            if ($LASTEXITCODE -ne 0) { throw "Publish failed: $Project" }
          }

          Publish-JackettProject 'src/Jackett.Server/Jackett.Server.csproj' $env:TARGET_FRAMEWORK $serverDir
          Publish-JackettProject 'src/Jackett.Updater/Jackett.Updater.csproj' $env:TARGET_FRAMEWORK $updaterDir
          Publish-JackettProject 'src/Jackett.Tray/Jackett.Tray.csproj' "$($env:TARGET_FRAMEWORK)-windows" $trayDir
          Publish-JackettProject 'src/Jackett.Service/Jackett.Service.csproj' "$($env:TARGET_FRAMEWORK)-windows" $serviceDir

          Copy-Item (Join-Path $serverDir '*') $packageDir -Recurse -Force

          Get-ChildItem $updaterDir -File -Filter 'JackettUpdater*' | ForEach-Object {
            Copy-Item $_.FullName $packageDir -Force
          }

          foreach ($name in @(
            'System.Drawing.dll',
            'System.Security.Cryptography.ProtectedData.dll',
            'WindowsBase.dll'
          )) {
            $source = Join-Path $trayDir $name
            if (Test-Path $source) {
              Copy-Item $source $packageDir -Force
            }
          }

          Get-ChildItem $trayDir -Recurse -File | ForEach-Object {
            $relative = $_.FullName.Substring($trayDir.Length).TrimStart('\')
            $target = Join-Path $packageDir $relative
            if (-not (Test-Path $target)) {
              New-Item (Split-Path $target) -ItemType Directory -Force | Out-Null
              Copy-Item $_.FullName $target
            }
          }

          Get-ChildItem $serviceDir -File -Filter 'JackettService*' | ForEach-Object {
            Copy-Item $_.FullName $packageDir -Force
          }

          Copy-Item 'jackett_launcher.bat' $packageDir -Force
          Copy-Item 'LICENSE' $packageDir -Force

          @(
            "repository: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY"
            "commit: ${{ steps.revision.outputs.sha }}"
            "requested ref: ${{ inputs.source_ref || github.ref }}"
            "runtime: $env:RUNTIME_IDENTIFIER"
            "framework: $env:TARGET_FRAMEWORK"
            "version: $version"
          ) | Set-Content (Join-Path $packageDir 'BUILD-INFO.txt') -Encoding utf8

          foreach ($required in @('JackettConsole.exe', 'JackettUpdater.exe', 'JackettTray.exe', 'JackettService.exe')) {
            if (-not (Test-Path (Join-Path $packageDir $required))) {
              throw "Expected build output was not found: $required"
            }
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Jackett-Custom_Windows-x86-${{ steps.revision.outputs.short_sha }}
          path: ${{ runner.temp }}/jackett-package
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

  build-linux:
    name: Linux x64 .NET 11 validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false

      - name: Set up .NET 11
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 11.0.x

      - name: Build retained .NET Standard 2.0 library targets
        run: |
          dotnet build src/DateTimeRoutines/DateTimeRoutines.csproj -c Release -f netstandard2.0
          dotnet build src/Jackett.Common/Jackett.Common.csproj -c Release -f netstandard2.0

      - name: Run focused indexer regression tests
        run: |
          dotnet test src/Jackett.Test/Jackett.Test.csproj --framework net11.0 --configuration Release --filter 'FullyQualifiedName~CardigannIndexer'

      - name: Publish self-contained Linux server and updater
        run: |
          set -euo pipefail
          dotnet publish src/Jackett.Server/Jackett.Server.csproj -c Release -f net11.0 -r linux-x64 --self-contained true -o "$RUNNER_TEMP/jackett-server"
          dotnet publish src/Jackett.Updater/Jackett.Updater.csproj -c Release -f net11.0 -r linux-x64 --self-contained true -o "$RUNNER_TEMP/jackett-updater"
          test -f "$RUNNER_TEMP/jackett-server/jackett"
          test -f "$RUNNER_TEMP/jackett-updater/JackettUpdater"

      - name: Smoke-test Jackett HTTP startup on .NET 11
        shell: bash
        run: |
          set -euo pipefail
          export XDG_CONFIG_HOME="$RUNNER_TEMP/jackett-smoke-config"
          mkdir -p "$XDG_CONFIG_HOME"
          "$RUNNER_TEMP/jackett-server/jackett" --NoUpdates --ListenPrivate --Port 19117 > "$RUNNER_TEMP/jackett-smoke.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=false
          for attempt in {1..90}; do
            if curl --noproxy '*' --fail --silent --show-error --max-time 2 http://127.0.0.1:19117/health -o "$RUNNER_TEMP/jackett-health.json" 2>/dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if [ "$ready" != true ] || ! grep -Eq '"status"[[:space:]]*:[[:space:]]*"OK"' "$RUNNER_TEMP/jackett-health.json"; then
            echo "::error::Jackett failed the GET /health startup check"
            tail -n 120 "$RUNNER_TEMP/jackett-smoke.log" || true
            exit 1
          fi
          echo "Jackett .NET 11 startup and /health JSON response verified."


  build-legacy:
    name: .NET Framework 4.7.1 compatibility
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false

      - name: Set up .NET 11 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 11.0.x

      - name: Compile legacy .NET Framework targets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($project in @(
            'src/Jackett.Server/Jackett.Server.csproj'
            'src/Jackett.Updater/Jackett.Updater.csproj'
            'src/Jackett.Test/Jackett.Test.csproj'
            'src/Jackett.IntegrationTests/Jackett.IntegrationTests.csproj'
          )) {
            dotnet build $project --configuration Release --framework net471
            if ($LASTEXITCODE -ne 0) { throw "Legacy build failed: $project" }
          }

  publish-release:
    name: Start rolling release publication
    needs: build-windows
    if: >-
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    permissions:
      actions: write

    steps:
      - name: Dispatch publication for this build
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'publish-rolling-release.yml',
              ref: 'master',
              inputs: {
                run_id: String(context.runId)
              }
            });

  update-scoop:
    name: Trigger scoop-bucket Excavator
    needs: build-windows
    if: >-
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: scoop-bucket

    permissions:
      contents: read

    steps:
      - name: Dispatch jackett-custom update
        if: env.SCOOP_BUCKET_TOKEN != ''
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        env:
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
        with:
          token: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          repository: marcmy/scoop-bucket
          event-type: jackett-custom-built
          client-payload: >-
            {"run_id":"${{ github.run_id }}","head_sha":"${{ needs.build-windows.outputs.source_sha }}"}

      - name: Note missing dispatch token
        if: env.SCOOP_BUCKET_TOKEN == ''
        env:
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
        shell: bash
        run: |
          echo "SCOOP_BUCKET_TOKEN is not configured; the bucket's hourly Excavator schedule will still discover the artifact." >> "$GITHUB_STEP_SUMMARY"
