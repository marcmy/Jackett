name: Temporary bootstrap security hotfix

on:
  push:
    paths:
      - .github/workflows/security-hotfix-bootstrap.yml

permissions: {}

jobs:
  patch:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Patch unsafe optgroup value construction
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/Jackett.Common/Content/libs/bootstrap-multiselect.js")
          source = path.read_text(encoding="utf-8")
          old = "        $('a label', $li).prepend('<input type=\"checkbox\" value=\"' + value + '\"/>');"
          new = "        var $checkbox = $('<input type=\"checkbox\"/>').val(value);\n        $('a label', $li).prepend($checkbox);"

          if source.count(old) != 1:
              raise SystemExit(f"Expected exactly one vulnerable construction, found {source.count(old)}")

          source = source.replace(old, new)
          path.write_text(source, encoding="utf-8")

      - name: Verify security regression
        shell: python
        run: |
          from pathlib import Path

          source = Path("src/Jackett.Common/Content/libs/bootstrap-multiselect.js").read_text(encoding="utf-8")
          unsafe = "prepend('<input type=\"checkbox\" value=\"' + value + '\"/>')"
          safe = "var $checkbox = $('<input type=\"checkbox\"/>').val(value);"

          if unsafe in source:
              raise SystemExit("Unsafe HTML concatenation is still present")
          if safe not in source:
              raise SystemExit("Safe checkbox construction was not found")

      - name: Check JavaScript syntax
        run: node --check src/Jackett.Common/Content/libs/bootstrap-multiselect.js

      - name: Commit bootstrap security fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Jackett.Common/Content/libs/bootstrap-multiselect.js
          git diff --cached --check
          git commit -m "Fix unsafe optgroup value HTML construction"
          git push origin HEAD:master
